<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Autoryzacja HQ | Wake The Brand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="hq-login-wrapper">
        <div class="section-header">
            <a href="index.html" class="logo">WAKE THE BRAND<span class="dot">.</span></a>
        </div>

        <div class="glass-card hq-login-card">
            <div class="center-text">
                <span class="section-tag">🔒 Strefa Założycieli (HQ)</span>
                <h1>Panel Administracji</h1>
                <p>
                    Wewnętrzny system planowania, plików Google Drive, wycen i zapytań dla właścicieli Wake The Brand.
                </p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Służbowy E-mail Założyciela</label>
                    <input type="email" id="loginEmail" required placeholder="np. mbugajski@wakethebrand.pl">
                </div>

                <div class="form-group">
                    <div class="label-row-between">
                        <label for="loginPassword">Hasło dostępu</label>
                        <button type="button" id="forgotPassBtn" class="forgot-pass-link">Resetuj hasło</button>
                    </div>
                    <input type="password" id="loginPassword" required placeholder="••••••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Zaloguj do Centrum HQ ⚡
                </button>

                <div id="loginFeedback" class="form-feedback center-text"></div>
            </form>

            <div class="hq-quick-hint">
                💡 Szybki dostęp z dowolnej podstrony:<br>
                skrót klawiszowy <strong>Ctrl + Shift + L</strong> lub ikonka <strong>🔒</strong> w stopce.
            </div>
        </div>

        <div class="section-cta-row">
            <a href="index.html" class="forgot-pass-link">← Wróć na stronę główną Wake The Brand</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
